<script>
var A=window.APP,M=A.model,C=A.cfg;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pick(v,fb){return(v===undefined||v===null||v==='')?fb:v}
/* troca os [PLACEHOLDERS] do modelo pelos dados do cliente */
function fill(s){
  s=String(s||'');
  if(C.bairro)s=s.replace(/\[SEU BAIRRO\]/g,C.bairro);
  if(C.fundacao)s=s.replace(/\[ANO\]/g,C.fundacao);
  if(C.campanha&&C.campanha.data)s=s.replace(/\[DATA\]/g,C.campanha.data);
  if(C.campanha&&C.campanha.desconto)s=s.replace(/\[00\]/g,C.campanha.desconto);
  return s;
}
var T=C.textos||{};
var NAME=pick(C.nome,M.brand?'':M.name)||M.name;
var SUB=pick(C.slogan,M.bsub||M.sub);
function initials(){
  if(C.iniciais)return C.iniciais;
  var p=NAME.replace(/[^\p{L}\s]/gu,'').split(/\s+/).filter(Boolean);
  return((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase();
}

 pin:'<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',

};
function svg(n,sz,col){return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="'+(col||'currentColor')+'" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ic[n]+'</svg>'}

/* dados do cliente com reserva do modelo */
var SERV=(C.servicos&&C.servicos.length?C.servicos:M.sv.map(function(s){return{nome:s[0],duracao:s[1],preco:s[2]}}));

var FECHADO=C.dias_fechados||[0];

var S={tab:'home',svc:-1,day:-1,time:-1,flt:'Todos',nome:''};

function photoTile(i,label,tall){
  var f=FOTOS[i];
  if(f){return '<div class="tile'+(tall?' tall':'')+'" style="background-image:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.72)),url(\''+esc(f.arquivo)+'\')" role="img" aria-label="'+esc(f.titulo||label)+'"><span></span><b>'+esc(f.titulo||label)+'</b></div>'}
  var a=[150,200,120,235,170,210,140,190][i%8],p1=[34,22,46,28,40,18,52,30][i%8],p2=[12,24,8,20,10,26,6,16][i%8];

function extra(){

      +(p.itens&&p.itens.length?p.itens:['[00] cortes por mês incluídos','Prioridade na agenda','Desconto em produtos e serviços']).map(ck).join('')

    return hh('Pacotes','Experiências')+pk.map(function(x){return '<div class="card"><div class="pk"><div><h4>'+esc(x.titulo)+'</h4><p>'+esc(x.descricao)+'</p></div><div class="pr">'+esc(pick(x.preco,'[R$ 00]'))+'</div></div></div>'}).join('');

  }
  return '';

function waLink(msg){return WA?'https://wa.me/'+WA+'?text='+encodeURIComponent(msg):'#'}

function vHome(){
  var t='';for(var i=0;i<4;i++)t+=photoTile(i,M.gl[i],i===1||i===2);
  var eb=fill(pick(T.eyebrow,M.eb)),h=fill(pick(T.titulo,M.h)),p=fill(pick(T.texto,M.p)),cta=pick(T.botao,M.cta);
  return '<div class="s-top"><div class="mono">'+esc(initials())+'</div><div><div class="s-name">'+esc(NAME)+'</div><div class="s-sub">'+esc(SUB)+'</div></div></div>'
  +'<section class="hero'+(M.lux||M.big?' big':'')+'">'+(M.mot?'<div class="mot" aria-hidden="true">'+svg(M.mot,170)+'</div>':'')+'<div class="eb">'+esc(eb)+'</div><h2>'+esc(h)+'</h2><p>'+esc(p)+'</p><button type="button" class="btn hb" data-go="book">'+esc(cta)+svg('arr',18)+'</button></section>'
  +hh('Vitrine','Trabalhos reais')+'<div class="grid">'+t+'</div>'
  +'<button type="button" class="btn out full" data-go="gal">Ver galeria completa</button>'
  +extra()
  +hh('Fale com a gente','Contato')
  +'<div class="card"><div class="row">'+svg('pin',22,'var(--s-act)')+'<span>'+(C.mapa?'<a class="ink" href="'+esc(C.mapa)+'" target="_blank" rel="noopener">'+esc(ENDERECO)+' · ver no mapa</a>':esc(ENDERECO))+'</span></div>'
  +'<div class="row">'+svg('ig',22,'var(--s-act)')+'<span>Instagram: <span class="ink">@'+esc(IG||'[seu_perfil]')+'</span></span></div>'
  +'<div class="row">'+svg('wa',22,'var(--s-act)')+'<span>WhatsApp: <span class="ink">'+esc(C.whatsapp_exibicao||(WA?'+'+WA:'[SEU NÚMERO]'))+'</span></span></div>'
  +'<a class="btn full" href="'+waLink('Olá! Vim pelo app e quero agendar um horário.')+'" target="_blank" rel="noopener">Falar no WhatsApp</a>'
  +'<a class="btn out full" href="'+(IG?'https://instagram.com/'+esc(IG):'#')+'" target="_blank" rel="noopener">Abrir no Instagram</a></div>';
}
function dias(){
  var out=[],d=new Date(),wd=['dom','seg','ter','qua','qui','sex','sáb'],i=0;
  while(out.length<8&&i<20){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+i);i++;
    if(FECHADO.indexOf(x.getDay())>-1)continue;
    out.push({w:i===1?'hoje':wd[x.getDay()],n:x.getDate(),m:x.getMonth()+1});}
  return out;
}
function bookMsg(){
  var d=dias()[S.day];
  return 'Olá! Quero agendar: '+SERV[S.svc].nome+' — '+(d.w==='hoje'?'hoje':d.w+', dia '+d.n+'/'+d.m)+' às '+HORAS[S.time]+'.'+(S.nome?' Meu nome é '+S.nome+'.':'');
}
function vBook(){
  var sv=SERV.map(function(s,i){return '<button type="button" role="radio" aria-checked="'+(S.svc===i)+'" class="opt" data-svc="'+i+'"><span>'+esc(s.nome)+(s.duracao?'<small>'+esc(s.duracao)+'</small>':'')+'</span><span class="pr">'+esc(s.preco||'')+'</span></button>'}).join('');
  var ds=dias().map(function(d,i){return '<button type="button" role="radio" aria-checked="'+(S.day===i)+'" class="chip" data-day="'+i+'"><small>'+d.w+'</small>'+d.n+'</button>'}).join('');
  var ts=HORAS.map(function(t,i){return '<button type="button" role="radio" aria-checked="'+(S.time===i)+'" class="chip" data-time="'+i+'">'+esc(t)+'</button>'}).join('');
  var ready=S.svc>-1&&S.day>-1&&S.time>-1;
  return hh('Agendar','3 passos')
  +'<div role="radiogroup" aria-label="Serviço" style="display:flex;flex-direction:column;gap:8px">'+sv+'</div>'
  +hh('Dia')+'<div class="chips" role="radiogroup" aria-label="Dia">'+ds+'</div>'
  +hh('Horário')+'<div class="times" role="radiogroup" aria-label="Horário">'+ts+'</div>'
  +'<label class="field">Seu nome<input id="cn" type="text" autocomplete="name" value="'+esc(S.nome)+'" placeholder="Como podemos te chamar?"></label>'
  +'<a id="send" class="btn full" target="_blank" rel="noopener" '+(ready&&WA?'href="'+waLink(bookMsg())+'"':'href="#" aria-disabled="true"')+'>'+svg('wa',20)+' Enviar pedido pelo WhatsApp</a>'
  +'<div class="demo">'+(WA?'O pedido abre no WhatsApp do estabelecimento, que confirma o horário com você.':'Informe o WhatsApp na configuração para ativar o envio.')+'</div>';
}
function cats(){var u=['Todos'];FOTOS.forEach(function(f){if(f.categoria&&u.indexOf(f.categoria)<0)u.push(f.categoria)});return u.slice(0,6)}
function vGal(){
  var chips=cats().map(function(x){return '<button type="button" class="chip f" aria-pressed="'+(S.flt===x)+'" data-flt="'+esc(x)+'">'+esc(x)+'</button>'}).join('');
  var t='';
  if(FOTOS.length){
    var k=0;FOTOS.forEach(function(f,i){if(S.flt==='Todos'||f.categoria===S.flt){t+=photoTile(i,f.titulo||'',k%3===1);k++}});
  } else {for(var i=0;i<8;i++)t+=photoTile(i,M.gl[i],i%3===1)}
  return hh('Galeria',(FOTOS.length||M.gl.length)+' trabalhos')+(FOTOS.length?'<div class="chips" role="group" aria-label="Filtro">'+chips+'</div>':'')+'<div class="grid">'+t+'</div>'
  +'<button type="button" class="btn full" data-go="book">Agendar meu horário</button>';
}
function render(){
  var tabs=[['home','Início','home'],['book','Agendar','cal'],['gal','Galeria','gal']];
  var view=S.tab==='home'?vHome():S.tab==='book'?vBook():vGal();
  $('app').innerHTML='<div class="body" id="body">'+view+'</div><nav class="tabs" aria-label="Navegação"><div class="in" role="tablist">'+tabs.map(function(t){return '<button type="button" role="tab" aria-selected="'+(S.tab===t[0])+'" data-go="'+t[0]+'">'+svg(t[2],24)+t[1]+'</button>'}).join('')+'</div></nav>';
}
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.go){S.tab=b.dataset.go;render();window.scrollTo(0,0);return}
  if(b.dataset.svc!==undefined){S.svc=+b.dataset.svc;return render()}
  if(b.dataset.day!==undefined){S.day=+b.dataset.day;return render()}
  if(b.dataset.time!==undefined){S.time=+b.dataset.time;return render()}
  if(b.dataset.flt!==undefined){S.flt=b.dataset.flt;return render()}
});
document.addEventListener('input',function(e){
  if(e.target.id!=='cn')return;S.nome=e.target.value;
  var a=$('send');if(a&&S.svc>-1&&S.day>-1&&S.time>-1&&WA)a.setAttribute('href',waLink(bookMsg()));
});
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
